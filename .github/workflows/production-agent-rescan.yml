name: Production Agent Rescan

on:
  pull_request:

jobs:
  verify-and-rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Record production reachability after deployment
        shell: bash
        run: |
          set -uo pipefail

          openapi_status="$(curl -sS -o /tmp/openapi.body -D /tmp/openapi.headers -w '%{http_code}' https://rowlandekemezie.com/openapi.json 2>/tmp/openapi.error || true)"
          profile_status="$(curl -sS -o /tmp/profile.body -D /tmp/profile.headers -w '%{http_code}' https://rowlandekemezie.com/api/v1/profile 2>/tmp/profile.error || true)"

          echo "openapi_status=${openapi_status:-request-failed}"
          echo "profile_status=${profile_status:-request-failed}"
          echo "--- openapi response headers ---"
          sed -n '1,20p' /tmp/openapi.headers 2>/dev/null || true
          echo "--- profile response headers ---"
          sed -n '1,20p' /tmp/profile.headers 2>/dev/null || true

          if grep -Eq '"security"[[:space:]]*:[[:space:]]*\[[[:space:]]*\]' /tmp/openapi.body 2>/dev/null && [ "$profile_status" = "200" ]; then
            echo "Production is directly serving the merged agent-ready runtime to curl."
          else
            echo "Production deployment is complete, but direct curl does not see the expected machine-readable surface. The Is Agentic rescan will measure the public edge behavior directly."
          fi

      - name: Install browser automation client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent-rescan
          cd /tmp/agent-rescan
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core@latest
          google-chrome --version

      - name: Trigger real Is Agentic rescan and wait for fresh report
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('/tmp/agent-rescan/node_modules/playwright-core')

          ;(async () => {
            const target = 'https://rowlandekemezie.com'
            const reportApi = `https://is-agentic.com/api/v1/report?url=${encodeURIComponent(target)}`
            const reportPage = 'https://is-agentic.com/scan/rowlandekemezie.com'

            function scannedAt(report) {
              return report?.scanned_at ?? report?.scannedAt ?? report?.scanned_at_iso ?? null
            }

            async function getReport() {
              const response = await fetch(reportApi, {
                headers: { accept: 'application/json' }
              })

              if (!response.ok) {
                throw new Error(`Report API returned ${response.status}: ${await response.text()}`)
              }

              return response.json()
            }

            const before = await getReport()
            const beforeTimestamp = scannedAt(before)
            console.log(`Before rescan: score=${before.score}, scanned_at=${beforeTimestamp}`)

            const browser = await chromium.launch({
              headless: true,
              channel: 'chrome'
            })

            try {
              const page = await browser.newPage()
              await page.goto(reportPage, { waitUntil: 'domcontentloaded', timeout: 60_000 })

              const rescan = page.getByRole('button', { name: /^Rescan$/ })
              await rescan.waitFor({ state: 'visible', timeout: 30_000 })
              await rescan.click()
              console.log('Clicked Is Agentic Rescan.')

              for (let attempt = 1; attempt <= 120; attempt += 1) {
                await new Promise(resolve => setTimeout(resolve, 5_000))
                const current = await getReport()
                const currentTimestamp = scannedAt(current)

                if (currentTimestamp && currentTimestamp !== beforeTimestamp) {
                  console.log('FRESH_IS_AGENTIC_REPORT_START')
                  console.log(JSON.stringify(current, null, 2))
                  console.log('FRESH_IS_AGENTIC_REPORT_END')
                  return
                }

                if (attempt % 6 === 0) {
                  console.log(`Still waiting for a fresh report (${attempt * 5}s).`)
                }
              }

              throw new Error('Is Agentic did not publish a fresh report within 10 minutes.')
            } finally {
              await browser.close()
            }
          })().catch(error => {
            console.error(error)
            process.exit(1)
          })
          NODE
