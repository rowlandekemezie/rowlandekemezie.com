name: Agent Preview Audit

on:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Confirm immutable Cloudflare preview
        run: |
          curl -fsS https://8e47b8ba.rowlandekemezie.pages.dev/openapi.json \
            | grep -q '"security": \[\]'

      - name: Audit immutable Cloudflare preview
        run: npx --yes is-agentic@latest https://8e47b8ba.rowlandekemezie.pages.dev --json
