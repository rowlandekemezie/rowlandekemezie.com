name: Agent Preview Audit

on:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Confirm immutable Cloudflare preview
        run: |
          curl -fsS https://48c4ad76.rowlandekemezie.pages.dev/openapi.json \
            | grep -q 'A structured machine-readable error using application/problem+json'

      - name: Audit immutable Cloudflare preview
        run: npx --yes is-agentic@latest https://48c4ad76.rowlandekemezie.pages.dev --json
