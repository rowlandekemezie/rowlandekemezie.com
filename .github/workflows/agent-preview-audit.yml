name: Agent Preview Audit

on:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Confirm latest Cloudflare preview
        run: |
          for attempt in {1..30}; do
            if curl -fsS https://feat-agent-readiness.rowlandekemezie.pages.dev/openapi.json | grep -q 'A structured machine-readable error using application/problem+json'; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run fresh Ora essentials scan
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            'https://ora.ai/api/scan?include=essentials' \
            --header 'content-type: application/json' \
            --data '{"url":"https://feat-agent-readiness.rowlandekemezie.pages.dev"}' \
            --output ora-scan.json
          cat ora-scan.json
