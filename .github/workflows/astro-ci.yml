name: Astro CI

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Astro type check
        run: pnpm astro:check

      - name: Verify content assets
        run: pnpm verify:content-assets

      - name: Build
        run: pnpm build

      - name: Verify generated output
        run: pnpm verify:dist

      - name: Verify agent readiness
        run: pnpm verify:agent-readiness

      - name: Verify launch gates
        run: pnpm verify:launch-gates
