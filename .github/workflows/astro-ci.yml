name: Astro CI

on:
  pull_request:
  push:
    branches:
      - develop
      - feat/**
      - concept/**

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify project
        run: corepack pnpm verify:all
