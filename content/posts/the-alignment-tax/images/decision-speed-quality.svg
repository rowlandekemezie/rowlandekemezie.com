<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Decision quality and speed by reporting layers</title>
  <desc id="desc">Grouped bar chart based on a McKinsey survey. Organizations with one to three reporting layers reported 70 percent high-quality decisions and 61 percent quick decisions. Four to six layers reported 53 and 47 percent. Seven or more reported 45 and 38 percent.</desc>
  <rect width="1000" height="620" rx="24" fill="#f8fafc"/>
  <text x="60" y="62" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Decision quality and speed fall as reporting layers increase</text>
  <text x="60" y="96" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#475569">Share of respondents who said decisions were high quality or quick</text>

  <line x1="100" y1="485" x2="930" y2="485" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="100" y1="145" x2="100" y2="485" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748b">
    <text x="72" y="490">0%</text>
    <text x="62" y="405">20%</text>
    <text x="62" y="320">40%</text>
    <text x="62" y="235">60%</text>
    <text x="62" y="150">80%</text>
  </g>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="100" y1="400" x2="930" y2="400"/>
    <line x1="100" y1="315" x2="930" y2="315"/>
    <line x1="100" y1="230" x2="930" y2="230"/>
    <line x1="100" y1="145" x2="930" y2="145"/>
  </g>

  <rect x="180" y="187.5" width="76" height="297.5" rx="8" fill="#2563eb"/>
  <rect x="266" y="225.75" width="76" height="259.25" rx="8" fill="#0f766e"/>
  <text x="218" y="174" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">70%</text>
  <text x="304" y="212" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">61%</text>

  <rect x="455" y="259.75" width="76" height="225.25" rx="8" fill="#2563eb"/>
  <rect x="541" y="285.25" width="76" height="199.75" rx="8" fill="#0f766e"/>
  <text x="493" y="246" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">53%</text>
  <text x="579" y="272" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">47%</text>

  <rect x="730" y="293.75" width="76" height="191.25" rx="8" fill="#2563eb"/>
  <rect x="816" y="323.5" width="76" height="161.5" rx="8" fill="#0f766e"/>
  <text x="768" y="280" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">45%</text>
  <text x="854" y="310" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">38%</text>

  <g font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600" fill="#334155">
    <text x="261" y="522" text-anchor="middle">1–3 layers</text>
    <text x="536" y="522" text-anchor="middle">4–6 layers</text>
    <text x="811" y="522" text-anchor="middle">7+ layers</text>
  </g>

  <rect x="675" y="91" width="14" height="14" rx="3" fill="#2563eb"/>
  <text x="698" y="103" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#334155">High-quality decisions</text>
  <rect x="835" y="91" width="14" height="14" rx="3" fill="#0f766e"/>
  <text x="858" y="103" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#334155">Quick decisions</text>

  <text x="60" y="580" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748b">Source: McKinsey Global Survey, 1,259 participants in 91 countries (2018 survey; published 2019). Correlation, not proof of causation.</text>
</svg>