<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="approval-title approval-desc">
  <title id="approval-title">The approval paradox</title>
  <desc id="approval-desc">A cycle where more approvals create longer queues, which encourage larger releases, increase blast radius and release anxiety, and then create demand for more approvals.</desc>

  <defs>
    <marker id="approval-arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="718" rx="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="62" font-size="32" font-weight="700" fill="#0f172a">The approval paradox</text>
    <text x="64" y="97" font-size="17" fill="#475569">A control added to reduce risk can create conditions that increase release risk</text>

    <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#approval-arrow)">
      <path d="M745 190 C820 202 858 240 884 300"/>
      <path d="M978 390 C980 448 935 492 865 515"/>
      <path d="M680 560 C620 620 580 620 520 560"/>
      <path d="M335 515 C255 477 215 435 220 390"/>
      <path d="M250 300 C303 233 370 202 455 190"/>
    </g>

    <g text-anchor="middle">
      <rect x="455" y="145" width="290" height="90" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
      <text x="600" y="181" font-size="20" font-weight="700" fill="#0f172a">More approvals</text>
      <text x="600" y="207" font-size="14" fill="#475569">More gates before release</text>

      <rect x="835" y="300" width="280" height="90" rx="16" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
      <text x="975" y="336" font-size="20" font-weight="700" fill="#0f172a">Longer queues</text>
      <text x="975" y="362" font-size="14" fill="#475569">More time waiting</text>

      <rect x="680" y="515" width="280" height="90" rx="16" fill="#ccfbf1" stroke="#5eead4" stroke-width="2"/>
      <text x="820" y="551" font-size="20" font-weight="700" fill="#0f172a">Larger releases</text>
      <text x="820" y="577" font-size="14" fill="#475569">Teams batch more work</text>

      <rect x="240" y="515" width="280" height="90" rx="16" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
      <text x="380" y="551" font-size="20" font-weight="700" fill="#0f172a">Higher blast radius</text>
      <text x="380" y="577" font-size="14" fill="#475569">Failures cost more</text>

      <rect x="85" y="300" width="280" height="90" rx="16" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
      <text x="225" y="336" font-size="20" font-weight="700" fill="#0f172a">More release anxiety</text>
      <text x="225" y="362" font-size="14" fill="#475569">The system feels less safe</text>

      <circle cx="600" cy="380" r="92" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="600" y="363" font-size="18" font-weight="700" fill="#0f172a">The organization</text>
      <text x="600" y="391" font-size="15" fill="#475569">responds to risk</text>
      <text x="600" y="415" font-size="15" fill="#475569">with more process</text>
    </g>

    <text x="64" y="684" font-size="13" fill="#64748b">Conceptual model based on DORA's findings on heavyweight change approval.</text>
  </g>
</svg>
