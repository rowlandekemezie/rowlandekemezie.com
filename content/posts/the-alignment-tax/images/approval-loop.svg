<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
  <title id="title">The approval paradox</title>
  <desc id="desc">A cycle where more approvals create longer queues, which encourage larger releases, which increase blast radius and release anxiety, which then creates demand for more approvals.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="660" rx="24" fill="#f8fafc"/>
  <text x="60" y="62" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="#0f172a">The approval paradox</text>
  <text x="60" y="96" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#475569">A control added to reduce risk can create conditions that increase release risk</text>

  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <rect x="380" y="135" width="240" height="86" rx="16" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="500" y="171" font-size="19" font-weight="700" fill="#0f172a">More approvals</text>
    <text x="500" y="197" font-size="14" fill="#475569">More gates before release</text>

    <rect x="685" y="260" width="240" height="86" rx="16" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="805" y="296" font-size="19" font-weight="700" fill="#0f172a">Longer queues</text>
    <text x="805" y="322" font-size="14" fill="#475569">More time waiting</text>

    <rect x="590" y="455" width="240" height="86" rx="16" fill="#ccfbf1" stroke="#5eead4"/>
    <text x="710" y="491" font-size="19" font-weight="700" fill="#0f172a">Larger releases</text>
    <text x="710" y="517" font-size="14" fill="#475569">Teams batch more work</text>

    <rect x="170" y="455" width="240" height="86" rx="16" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="290" y="491" font-size="19" font-weight="700" fill="#0f172a">Higher blast radius</text>
    <text x="290" y="517" font-size="14" fill="#475569">Failures cost more</text>

    <rect x="75" y="260" width="240" height="86" rx="16" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="195" y="296" font-size="19" font-weight="700" fill="#0f172a">More release anxiety</text>
    <text x="195" y="322" font-size="14" fill="#475569">The system feels less safe</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M610 190 C690 200, 735 220, 775 260"/>
    <path d="M835 350 C835 400, 800 438, 760 455"/>
    <path d="M590 510 C520 545, 475 545, 410 510"/>
    <path d="M240 455 C195 425, 170 390, 170 346"/>
    <path d="M225 260 C265 218, 320 198, 390 188"/>
  </g>

  <circle cx="500" cy="333" r="82" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="500" y="320" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#0f172a">The organization</text>
  <text x="500" y="346" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#475569">responds to risk</text>
  <text x="500" y="368" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#475569">with more process</text>

  <text x="60" y="612" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748b">Conceptual model. DORA reports that heavyweight external approvals are associated with slower delivery and larger batches, without evidence of lower change failure rates.</text>
</svg>